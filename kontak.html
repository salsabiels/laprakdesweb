<!DOCTYPE html>

<body>
    <header>
        <h1>Pusat Konservasi Anggrek Hutan Kalimantan</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="spesies.html">Katalog Spesies</a></li>
            <li><a href="kontak.html">Daftar Relawan</a></li>
        </ul>
    </nav>

    <main>
        <h2>Formulir Pendaftaran Relawan Konservasi</h2>
        <p>Mari bergabung bersama kami untuk melindungi anggrek hutan langsung dari lapangannya.</p>

        <!-- Formulir minimal 3 input (text, email, radio) + submit -->
        <form action="#" method="POST">
            <div>
                <label for="namaLengkap">Nama Lengkap Relawan:</label><br>
                <input type="text" id="namaLengkap" name="nama" required>
            </div>
            <br>

            <div>
                <label for="emailRelawan">Alamat Email Aktif:</label><br>
                <input type="email" id="emailRelawan" name="email" required>
            </div>
            <br>

            <div>
                <p>Pilih Divisi Penugasan:</p>
                <input type="radio" id="divisiEdukasi" name="divisi" value="Edukasi" required>
                <label for="divisiEdukasi">Divisi Edukasi & Sosial</label><br>

                <input type="radio" id="divisiLapangan" name="divisi" value="Lapangan">
                <label for="divisiLapangan">Divisi Observasi Lapangan</label>
            </div>
            <br>

            <button type="submit">Kirim Pendaftaran</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Pusat Konservasi Anggrek Kalimantan.</p>
    </footer>
</body>

</html>
